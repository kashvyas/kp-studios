name: APEX Launch Copilot tests

on:
  push:
    paths:
      - "apex-launch-copilot/**"
      - ".github/workflows/apex-launch-copilot-tests.yml"
  pull_request:
    paths:
      - "apex-launch-copilot/**"
      - ".github/workflows/apex-launch-copilot-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apex-launch-copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m evals.run_evals
